<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="System Check" />
  <title>System Check</title>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #050505;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Arial, sans-serif;
    }

    body {
      min-height: 100svh;
      position: fixed;
      inset: 0;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    #app {
      position: fixed;
      inset: 0;
      min-height: 100svh;
      padding: calc(var(--safe-top) + 18px) calc(var(--safe-right) + 18px)
               calc(var(--safe-bottom) + 18px) calc(var(--safe-left) + 18px);
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 30%, rgba(120,0,0,.24), transparent 40%),
        linear-gradient(180deg, #020202, #0d0d0d);
      isolation: isolate;
    }

    .panel {
      width: min(92vw, 520px);
      text-align: center;
      z-index: 10;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(34px, 9vw, 58px);
      letter-spacing: -1.5px;
    }

    p {
      margin: 8px 0;
      opacity: .82;
      font-size: 17px;
      line-height: 1.45;
    }

    button {
      margin-top: 22px;
      width: 100%;
      border: 0;
      border-radius: 18px;
      padding: 17px 20px;
      font-size: 19px;
      font-weight: 800;
      background: white;
      color: black;
      box-shadow: 0 10px 30px rgba(255,255,255,.12);
    }

    .hidden { display: none !important; }

    #warning {
      color: #ff3b30;
      text-transform: uppercase;
      font-size: clamp(14px, 4vw, 20px);
      font-weight: 900;
      letter-spacing: 2px;
      animation: blink .45s infinite alternate;
    }

    #status {
      margin-top: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 15px;
      min-height: 44px;
    }

    .bar {
      height: 18px;
      margin-top: 18px;
      border: 1px solid #555;
      border-radius: 999px;
      overflow: hidden;
      background: #191919;
    }

    .fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff3b30, #ffcc00);
      transition: width .28s linear;
    }

    #percent {
      margin-top: 8px;
      font-weight: 800;
      font-size: 20px;
    }

    .chicken {
      position: fixed;
      z-index: 3;
      user-select: none;
      pointer-events: none;
      animation: pop .35s ease-out, wobble .6s infinite alternate ease-in-out;
      filter: drop-shadow(0 8px 10px rgba(0,0,0,.5));
    }

    .glitch {
      animation: shake .08s infinite;
    }

    #flash {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: rgba(255,0,0,0);
    }

    #reveal h1 { font-size: clamp(42px, 12vw, 74px); }
    #reveal p { font-size: 20px; }

    @keyframes blink { to { opacity: .25; } }
    @keyframes pop {
      from { transform: scale(.1) rotate(-30deg); opacity: 0; }
      to { transform: scale(1) rotate(0); opacity: 1; }
    }
    @keyframes wobble {
      from { rotate: -8deg; }
      to { rotate: 8deg; }
    }
    @keyframes shake {
      0% { transform: translate(0,0); }
      25% { transform: translate(2px,-2px); }
      50% { transform: translate(-2px,2px); }
      75% { transform: translate(2px,2px); }
      100% { transform: translate(-2px,-2px); }
    }
  </style>
</head>
<body>
  <main id="app">
    <div id="flash"></div>

    <section id="start" class="panel">
      <h1>System Check</h1>
      <p>Tap below to continue.</p>
      <button id="startBtn">Continue</button>
      <p style="font-size:13px; margin-top:14px;">Harmless prank page. Swipe up or close Safari at any time.</p>
    </section>

    <section id="prank" class="panel hidden">
      <div id="warning">⚠ Poultry Virus Detected ⚠</div>
      <h1 id="headline">CHICKEN.EXE</h1>
      <div id="status">Initialising coop takeover…</div>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div id="percent">0%</div>
    </section>

    <section id="reveal" class="panel hidden">
      <h1>🐔 YOU GOT CLUCKED!</h1>
      <p>No virus. No damage. Just a prank.</p>
      <button id="againBtn">Run It Again</button>
    </section>
  </main>

  <script>
    const start = document.getElementById('start');
    const prank = document.getElementById('prank');
    const reveal = document.getElementById('reveal');
    const fill = document.getElementById('fill');
    const percent = document.getElementById('percent');
    const status = document.getElementById('status');
    const headline = document.getElementById('headline');
    const flash = document.getElementById('flash');

    let ctx;
    let timers = [];

    function clearTimers() {
      timers.forEach(t => clearTimeout(t));
      timers = [];
    }

    function schedule(fn, ms) {
      const t = setTimeout(fn, ms);
      timers.push(t);
    }

    function makeCluck() {
      if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();

      osc.type = 'square';
      osc.frequency.setValueAtTime(520 + Math.random() * 180, now);
      osc.frequency.exponentialRampToValueAtTime(170 + Math.random() * 60, now + 0.11);

      filter.type = 'bandpass';
      filter.frequency.value = 900;
      filter.Q.value = 1.2;

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.22, now + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + 0.15);

      setTimeout(() => {
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'sawtooth';
        osc2.frequency.setValueAtTime(360, ctx.currentTime);
        osc2.frequency.exponentialRampToValueAtTime(145, ctx.currentTime + 0.09);
        gain2.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain2.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.008);
        gain2.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.1);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start();
        osc2.stop(ctx.currentTime + 0.11);
      }, 90);
    }

    function addChicken() {
      const c = document.createElement('div');
      c.className = 'chicken';
      c.textContent = Math.random() > 0.28 ? '🐔' : '🐣';
      c.style.left = Math.random() * 88 + 'vw';
      c.style.top = Math.random() * 82 + 'vh';
      c.style.fontSize = (32 + Math.random() * 58) + 'px';
      c.style.transform = `rotate(${Math.random()*40-20}deg)`;
      document.body.appendChild(c);
      schedule(() => c.remove(), 7000);
    }

    function pulse() {
      flash.style.background = 'rgba(255,0,0,.22)';
      schedule(() => flash.style.background = 'rgba(255,0,0,0)', 90);
    }

    async function tryFullscreen() {
      const el = document.documentElement;
      try {
        if (el.requestFullscreen) await el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } catch (e) {}
    }

    function runPrank() {
      clearTimers();
      document.querySelectorAll('.chicken').forEach(x => x.remove());
      start.classList.add('hidden');
      reveal.classList.add('hidden');
      prank.classList.remove('hidden');
      fill.style.width = '0%';
      percent.textContent = '0%';
      headline.classList.add('glitch');

      tryFullscreen();
      if (ctx && ctx.state === 'suspended') ctx.resume();

      const messages = [
        'Initialising coop takeover…',
        'Scanning for breadcrumbs…',
        'Downloading 47 chickens…',
        'Egg encryption enabled…',
        'Converting contacts to poultry…',
        'Deploying emergency feathers…',
        'Finalising cluck protocol…'
      ];

      let value = 0;
      let step = 0;

      const tick = () => {
        value += 2 + Math.floor(Math.random() * 5);
        if (value > 100) value = 100;
        fill.style.width = value + '%';
        percent.textContent = value + '%';

        if (value % 10 < 5) addChicken();
        if (value % 16 < 5) {
          makeCluck();
          pulse();
          if (navigator.vibrate) navigator.vibrate(70);
        }

        const newStep = Math.min(messages.length - 1, Math.floor(value / 15));
        if (newStep !== step) {
          step = newStep;
          status.textContent = messages[step];
        }

        if (value < 100) {
          schedule(tick, 300);
        } else {
          status.textContent = 'COOP TAKEOVER COMPLETE';
          for (let i = 0; i < 16; i++) schedule(addChicken, i * 90);
          for (let i = 0; i < 5; i++) schedule(makeCluck, i * 230);
          schedule(showReveal, 2200);
        }
      };

      makeCluck();
      tick();
    }

    function showReveal() {
      prank.classList.add('hidden');
      reveal.classList.remove('hidden');
      headline.classList.remove('glitch');
      flash.style.background = 'rgba(255,0,0,0)';
    }

    document.getElementById('startBtn').addEventListener('click', runPrank);
    document.getElementById('againBtn').addEventListener('click', runPrank);
  </script>
</body>
</html>
